name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blindsay
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run core tests with coverage
        run: bun test tests --coverage

      - name: Run isolated page and component suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests-isolated/*.test.ts tests-isolated/*.test.tsx)
          for file in "${files[@]}"; do
            echo "::group::$file"
            bun test "$file"
            echo "::endgroup::"
          done
